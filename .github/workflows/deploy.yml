name: Build and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-workflow]

permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  HASH_FILE: build_hash
  SOURCE_REPO: sansan-han/yohaku-custom
  SOURCE_REF: main
  BUILD_COMMAND: pnpm --filter @yohaku/web build:ci
  STANDALONE_SUBPATH: standalone/apps/web

jobs:
  check:
    name: Check source revision
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'Update hash file' }}

    outputs:
      should_deploy: ${{ steps.compare.outputs.should_deploy }}
      source_sha: ${{ steps.compare.outputs.source_sha }}

    steps:
      - name: Checkout deploy configuration
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Compare deployed and source revisions
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          deployed_hash="$(tr -d '[:space:]' < "$HASH_FILE" 2>/dev/null || true)"
          source_sha="$(gh api "repos/${SOURCE_REPO}/commits/${SOURCE_REF}" --jq '.sha')"

          echo "Deployed revision: ${deployed_hash:-none}"
          echo "Source revision: $source_sha"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          if [[ -n "$deployed_hash" && "$source_sha" == "$deployed_hash"* ]]; then
            echo "Source is already deployed."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "A new source revision will be deployed."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.should_deploy == 'true' }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.source_sha }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Verify source revision
        env:
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_GATEWAY_URL }}
        run: |
          ${{ env.BUILD_COMMAND }}
          cd apps/web/.next
          rm -rf cache
          cp -r ../public ./standalone/public
          mv ./static ./standalone/apps/web/.next/static
          cd ./standalone
          echo ';process.title = "Yohaku (NextJS)"' >> server.js
          cd "$GITHUB_WORKSPACE"
          mkdir -p assets
          (cd apps/web/.next && zip -q --symlinks -r "$GITHUB_WORKSPACE/assets/release.zip" ./* -x "dev/*" -x "cache/*")

      - name: Checkout deploy configuration
        uses: actions/checkout@v7
        with:
          ref: main
          path: .deploy-config

      - name: Prepare deployment files
        run: |
          mv assets/release.zip release.zip
          cp .deploy-config/pm2/ecosystem.config.js ecosystem.config.js

      - name: Copy release archive
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: 'release.zip'
          target: '/tmp/yohaku'

      - name: Copy PM2 configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: 'ecosystem.config.js'
          target: '/tmp/yohaku'

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          command_timeout: 5m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            source $HOME/.bashrc
            basedir=$HOME/yohaku
            workdir=$basedir/${{ github.run_number }}
            mkdir -p $workdir
            mkdir -p $basedir/.cache
            mv /tmp/yohaku/release.zip $workdir/release.zip
            install -m 644 /tmp/yohaku/ecosystem.config.js $basedir/ecosystem.config.js
            cd $workdir
            unzip -qq -o $workdir/release.zip
            rm -r /tmp/yohaku
            rm -rf $workdir/${{ env.STANDALONE_SUBPATH }}/.env
            ln -s $HOME/yohaku/.env $workdir/${{ env.STANDALONE_SUBPATH }}/.env
            export NEXT_SHARP_PATH=$(npm root -g)/sharp
            # https://github.com/Unitech/pm2/issues/3054
            # symlink workdir node entry file to basedir
            ln -sf $workdir/${{ env.STANDALONE_SUBPATH }}/server.js $basedir/server.js
            mkdir -p $workdir/${{ env.STANDALONE_SUBPATH }}/.next
            rm -rf $workdir/${{ env.STANDALONE_SUBPATH }}/.next/cache
            ln -sf $basedir/.cache $workdir/${{ env.STANDALONE_SUBPATH }}/.next/cache
            cd $basedir
            if pm2 describe Yohaku >/dev/null 2>&1; then
              pm2 reload ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js --update-env
            fi
            rm $workdir/release.zip
            pm2 save
            echo "Deployed successfully"

      - name: Record deployed revision
        working-directory: .deploy-config
        env:
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > "$HASH_FILE"
          if git diff --quiet -- "$HASH_FILE"; then
            echo "Deployment revision is already recorded."
            exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$HASH_FILE"
          git commit -m "Update hash file"
          git push origin HEAD:main
